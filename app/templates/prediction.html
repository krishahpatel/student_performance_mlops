<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f7f6;
            color: #24313a;
            line-height: 1.5;
        }
        main {
            width: min(520px, 100%);
            padding: 32px;
            background: #fff;
            border: 1px solid #e0e9e7;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(27, 55, 52, .06);
            text-align: center;
        }
        .eyebrow {
            margin: 0 0 8px;
            color: #168477;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        h1 { margin: 0 0 18px; font-size: 1.9rem; }
        .result {
            margin: 0 auto 22px;
            padding: 20px;
            border-radius: 10px;
            background: #eef8f5;
        }
        .result-label { margin: 0 0 4px; color: #617079; font-size: .92rem; }
        .prediction { margin: 0; color: #116e62; font-size: 2rem; font-weight: 700; }
        .probabilities { margin: 0 0 24px; color: #52616a; }
        .probabilities p { margin: 7px 0; }
        a {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 8px;
            background: #168477;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #106b61; }
        @media (max-width: 480px) { main { padding: 24px 18px; } }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Prediction complete</p>
        <h1>Student Performance Result</h1>
        <section class="result">
            <p class="result-label">Predicted result</p>
            <p class="prediction">{{ prediction }}</p>
        </section>
        {% if probability %}
        <div class="probabilities">
            <p>Fail probability: <strong>{{ "%.1f"|format(probability["Fail"] * 100) }}%</strong></p>
            <p>Pass probability: <strong>{{ "%.1f"|format(probability["Pass"] * 100) }}%</strong></p>
        </div>
        {% endif %}
        <a href="{{ url_for('welcome') }}">Make another prediction</a>
    </main>
</body>
</html>
