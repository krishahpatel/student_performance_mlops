
services:
  dbapp:
    build: ./microservices/dbapp
    image: student-performance-dbapp:latest
    environment:
      DATABASE_PATH: /data/student_predictions.db
    volumes:
      - db_data:/data
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  webapp:
    build: ./microservices/webapp
    image: student-performance-webapp:latest
    environment:
      DB_SERVICE_URL: http://dbapp:8001
      PORT: "5000"
    expose:
      - "5000"
    depends_on:
      dbapp:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
