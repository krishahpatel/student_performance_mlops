apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-performance-api
  labels:
    app: student-performance-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-performance-api
  template:
    metadata:
      labels:
        app: student-performance-api
    spec:
      containers:
        - name: flask
          image: student-performance-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
